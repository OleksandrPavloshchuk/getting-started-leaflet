<!-- marker-selected.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="25" height="41" viewBox="0 0 25 41" aria-hidden="true">
    <title>Map marker</title>
    <defs>
        <!-- small gradient -->
        <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="white" stop-opacity="0.35"/>
            <stop offset="1" stop-color="white" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- contour shadow -->
    <path d="M12.5 0
           C7 0 2.5 4.5 2.5 10
           C2.5 21.5 12.5 33.5 12.5 33.5
           C12.5 33.5 22.5 21.5 22.5 10
           C22.5 4.5 18 0 12.5 0 Z"
          fill="#00cc66" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

    <!-- glow above -->
    <path d="M12.5 0
           C9.1 0 6.3 2.1 5 5
           C6.6 4.0 9.0 3.5 12.5 3.5
           C15.5 3.5 18.0 4.0 19.5 5
           C18.0 2.1 15.9 0 12.5 0 Z"
          fill="url(#g1)" />

    <!-- "eye" (white circle) -->
    <circle cx="12.5" cy="10" r="4" fill="#fff" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>

    <!-- small shadow below (for volume) -->
    <ellipse cx="12.5" cy="31.5" rx="3.5" ry="1.6" fill="rgba(0,0,0,0.08)"/>

</svg>
